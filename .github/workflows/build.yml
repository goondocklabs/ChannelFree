# Compile check for work branches (main releases through release.yml).
name: Build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build Jellyfin.Plugin.QuasiTV.csproj -c Release -o out
